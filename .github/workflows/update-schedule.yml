name: Update IB-261 schedule

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Дата YYYY-MM-DD; пусто = сегодня по Europe/Moscow"
        required: false
        type: string
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write

concurrency:
  group: ib261-schedule-publication
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SCHEDULE_PROXY_URL: ${{ secrets.SCHEDULE_PROXY_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run playwright install --with-deps chromium
      - name: Prepare browser diagnostics
        env:
          IB261_DIAGNOSTICS_DIR: ${{ runner.temp }}/ib261-diagnostics
        run: mkdir -p "$IB261_DIAGNOSTICS_DIR"
      - name: Fetch and publish verified snapshot
        env:
          REQUESTED_DATE: ${{ inputs.date }}
          TZ: Europe/Moscow
          IB261_DIAGNOSTICS_DIR: ${{ runner.temp }}/ib261-diagnostics
        run: uv run python scripts/fetch_schedule.py
      - name: Verify published snapshot files
        env:
          REQUESTED_DATE: ${{ inputs.date }}
        run: |
          test -s published-schedules/schedule.json
          test -s published-schedules/schedule.png
          uv run python scripts/validate_publication.py published-schedules
      - name: Finalize browser diagnostics
        if: always()
        env:
          IB261_DIAGNOSTICS_DIR: ${{ runner.temp }}/ib261-diagnostics
        run: |
          mkdir -p "$IB261_DIAGNOSTICS_DIR"
          {
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "job=${GITHUB_JOB}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "sha=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF_NAME}"
            echo "diagnostics_dir=$IB261_DIAGNOSTICS_DIR"
          } > "$IB261_DIAGNOSTICS_DIR/workflow-context.txt"
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ib261-browser-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/ib261-diagnostics
          if-no-files-found: warn
          retention-days: 7
      - name: Commit only changed verified publication
        run: |
          pwd
          find published-schedules -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          git status --short
          sha256sum published-schedules/schedule.json published-schedules/schedule.png
          git add published-schedules/schedule.json published-schedules/schedule.png published-schedules
          if git diff --cached --quiet -- published-schedules; then
            echo "Published files are unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update verified IB-261 schedule"
            git push origin HEAD:main
          fi
          test -n "$(git ls-files --error-unmatch published-schedules/schedule.json)"
          test -n "$(git ls-files --error-unmatch published-schedules/schedule.png)"
